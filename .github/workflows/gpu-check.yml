name: GPU — корректность лабораторной

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

env:
  CI_TRUSTED_SHA: ${{ github.workflow_sha }}
  PYTHONPATH: ${{ github.workspace }}/lab-runner
  PYTHONSAFEPATH: "1"

concurrency:
  group: submission-gpu-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Допуск и проверка изменений
    if: ${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.GPU_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - &install_base
        name: Установить системные пакеты
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          log="$RUNNER_TEMP/apt.log"
          if ! {
            apt-get update &&
            apt-get install --yes --no-install-recommends ca-certificates git python3 libstdc++6
          } > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
      - &course_checkout
        name: Получить код курса
        id: course_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: course
          persist-credentials: false
      - &runner_pin
        name: Проверить коммит курса и прочитать пин
        id: runner_pin
        run: |
          [[ $(git -C course rev-parse HEAD) == "$CI_TRUSTED_SHA" ]]
          lock=course/.github/lab-runner.lock
          [[ -f "$lock" && ! -L "$lock" && $(wc -c < "$lock") -eq 41 ]]
          IFS= read -r sha < "$lock"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - &runner_checkout
        name: Получить закреплённый раннер
        id: runner_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: comiam/cuda-cource-lab-runner
          ref: ${{ steps.runner_pin.outputs.sha }}
          path: lab-runner
          token: ${{ secrets.LAB_RUNNER_READ_TOKEN }}
          persist-credentials: false
      - &verify_runner
        name: Проверить коммит раннера
        id: verify_runner
        env:
          EXPECTED_RUNNER_SHA: ${{ steps.runner_pin.outputs.sha }}
        run: '[[ $(git -C lab-runner rev-parse HEAD) == "$EXPECTED_RUNNER_SHA" ]]'
      - name: Подготовить запрос GPU
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GPU_RUNTIME: ${{ vars.GPU_CI_RUNTIME_REVISION }}
        run: >-
          python3 -m tools.gpu_check prepare --seed-only
          --pr-number "$PR_NUMBER" --event-file "$GITHUB_EVENT_PATH"
          --runtime-revision "$GPU_RUNTIME"
          --request-file .ci-gpu/request.json --state-file .ci-gpu/state.json
      - name: Сохранить состояние проверки
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Отметить проверку в PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.gpu_check pending --pr-number "$PR_NUMBER" --state-file .ci-gpu/state.json
      - name: Сохранить запрос GPU
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/request.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  run:
    name: Проверка на GPU-хосте
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 160
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Проверить происхождение запроса
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.submission_check.artifacts --kind gpu-request
      - name: Скачать запрос GPU
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Проверить сдачу на GPU через S3
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPU_QUEUE_BUCKET: ${{ vars.GPU_QUEUE_BUCKET }}
          GPU_QUEUE_ACCESS_KEY_ID: ${{ secrets.GPU_QUEUE_ACCESS_KEY_ID }}
          GPU_QUEUE_SECRET_ACCESS_KEY: ${{ secrets.GPU_QUEUE_SECRET_ACCESS_KEY }}
        run: >-
          python3 -m tools.gpu_check run --request-file .ci-gpu/request.json
          --result-file .ci-gpu/result.json --s3-bucket "$GPU_QUEUE_BUCKET"
          --poll-interval 10 --timeout 9120
      - name: Сохранить результат GPU
        if: ${{ always() && steps.verify_runner.outcome == 'success' && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  report:
    name: Публикация результата GPU
    needs: [prepare, run]
    if: ${{ always() && github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.GPU_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Проверить происхождение артефактов
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.submission_check.artifacts --kinds gpu-state gpu-result --required-kind gpu-state --gpu-report-replay
      - name: Скачать состояние проверки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.gpu_state_artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Скачать результат GPU
        if: ${{ steps.artifacts.outputs.gpu_result_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.gpu_result_artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Опубликовать итог в PR
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_OUTCOME: ${{ steps.artifacts.outputs.gpu_result_outcome || needs.run.result }}
          GPU_QUEUE_BUCKET: ${{ vars.GPU_QUEUE_BUCKET }}
          GPU_QUEUE_ACCESS_KEY_ID: ${{ secrets.GPU_QUEUE_ACCESS_KEY_ID }}
          GPU_QUEUE_SECRET_ACCESS_KEY: ${{ secrets.GPU_QUEUE_SECRET_ACCESS_KEY }}
        run: >-
          python3 -m tools.gpu_check report --pr-number "$PR_NUMBER"
          --state-file .ci-gpu/state.json --result-file .ci-gpu/result.json
          --run-outcome "$RUN_OUTCOME" --s3-bucket "$GPU_QUEUE_BUCKET"
